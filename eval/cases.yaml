# Gold-standard evaluation set (SYNTHETIC).
# Labels were written by hand from guideline/label text — NOT generated by running the engine.
# Status: draft labels, pending review by 2–3 pharmacists (see review_sheet.csv).
#
# Each case: profile/meds/pgx override the defaults in run_eval.py; each visit overrides NORMAL values.
# expected:
#   findings: stop/action/info finding ids that MUST appear (stop/action not listed here = false flag)
#   factors:  NMR add-on factor ids that MUST appear (others = false flag)
#   risks:    {cvd|dm: category}
#   trend:    {analyte: verdict}
#   advice:   lifestyle ids that MUST appear (optional)
cases:
  # ---------------- HLA-B hard stops
  - id: E01
    scenario: HLA-B*15:02 positive + carbamazepine
    meds: [{drug: carbamazepine, dose_mg: 400}]
    pgx: {"HLA-B*15:02": positive}
    expected: {findings: [pgx-hlab1502-carbamazepine]}
  - id: E02
    scenario: HLA-B*15:02 positive + oxcarbazepine
    meds: [{drug: oxcarbazepine, dose_mg: 600}]
    pgx: {"HLA-B*15:02": positive}
    expected: {findings: [pgx-hlab1502-oxcarbazepine]}
  - id: E03
    scenario: HLA-B*15:02 negative + carbamazepine (no alert)
    meds: [{drug: carbamazepine, dose_mg: 400}]
    pgx: {"HLA-B*15:02": negative}
    expected: {findings: []}
  - id: E04
    scenario: Carbamazepine, HLA-B*15:02 never tested (label — screen before starting)
    meds: [{drug: carbamazepine, dose_mg: 400}]
    expected: {findings: [pgx-untested-hlab1502-carbamazepine]}
  - id: E05
    scenario: HLA-B*58:01 positive + allopurinol
    meds: [{drug: allopurinol, dose_mg: 100}]
    pgx: {"HLA-B*58:01": positive}
    expected: {findings: [pgx-hlab5801]}
  - id: E06
    scenario: HLA-B*58:01 negative + allopurinol (no alert)
    meds: [{drug: allopurinol, dose_mg: 100}]
    pgx: {"HLA-B*58:01": negative}
    expected: {findings: []}
  - id: E07
    scenario: Allopurinol, HLA-B*58:01 never tested (Thai/SE Asian ancestry — test first)
    meds: [{drug: allopurinol, dose_mg: 100}]
    expected: {findings: [pgx-untested-hlab5801]}

  # ---------------- SLCO1B1 – simvastatin
  - id: E08
    scenario: SLCO1B1 decreased function + simvastatin 40
    meds: [{drug: simvastatin, dose_mg: 40}]
    pgx: {SLCO1B1: decreased function}
    expected: {findings: [pgx-slco1b1-simva]}
  - id: E09
    scenario: SLCO1B1 poor function + simvastatin 20
    meds: [{drug: simvastatin, dose_mg: 20}]
    pgx: {SLCO1B1: poor function}
    expected: {findings: [pgx-slco1b1-simva]}
  - id: E10
    scenario: SLCO1B1 normal function + simvastatin 40 (no alert)
    meds: [{drug: simvastatin, dose_mg: 40}]
    pgx: {SLCO1B1: normal function}
    expected: {findings: []}
  - id: E11
    scenario: SLCO1B1 decreased function on rosuvastatin 10 — within CPIC ≤20 mg starting dose, no alert
    meds: [{drug: rosuvastatin, dose_mg: 10}]
    pgx: {SLCO1B1: decreased function}
    expected: {findings: []}

  # ---------------- CYP2C19 – clopidogrel / PPI
  - id: E12
    scenario: CYP2C19 poor metabolizer + clopidogrel
    meds: [{drug: clopidogrel, dose_mg: 75}]
    pgx: {CYP2C19: poor metabolizer}
    expected: {findings: [pgx-cyp2c19-clop]}
  - id: E13
    scenario: CYP2C19 intermediate metabolizer + clopidogrel (CPIC 2022 — avoid standard dose in ACS/PCI)
    meds: [{drug: clopidogrel, dose_mg: 75}]
    pgx: {CYP2C19: intermediate metabolizer}
    expected: {findings: [pgx-cyp2c19-clop]}
  - id: E14
    scenario: CYP2C19 normal metabolizer + clopidogrel (no alert)
    meds: [{drug: clopidogrel, dose_mg: 75}]
    pgx: {CYP2C19: normal metabolizer}
    expected: {findings: []}
  - id: E15
    scenario: Clopidogrel + omeprazole (label DDI)
    meds: [{drug: clopidogrel, dose_mg: 75}, {drug: omeprazole, dose_mg: 20}]
    expected: {findings: [ddi-clop-omeprazole]}
  - id: E16
    scenario: Clopidogrel + esomeprazole (label DDI)
    meds: [{drug: clopidogrel, dose_mg: 75}, {drug: esomeprazole, dose_mg: 40}]
    expected: {findings: [ddi-clop-esomeprazole]}
  - id: E17
    scenario: Clopidogrel + pantoprazole (preferred PPI — no alert)
    meds: [{drug: clopidogrel, dose_mg: 75}, {drug: pantoprazole, dose_mg: 40}]
    expected: {findings: []}
  - id: E18
    scenario: CYP2C19 PM + clopidogrel + omeprazole — PGx + DDI both shown
    meds: [{drug: clopidogrel, dose_mg: 75}, {drug: omeprazole, dose_mg: 20}]
    pgx: {CYP2C19: poor metabolizer}
    expected: {findings: [pgx-cyp2c19-clop, ddi-clop-omeprazole]}
  - id: E19
    scenario: CYP2C19 ultrarapid + omeprazole
    meds: [{drug: omeprazole, dose_mg: 20}]
    pgx: {CYP2C19: ultrarapid metabolizer}
    expected: {findings: [pgx-cyp2c19-omeprazole]}
  - id: E45
    scenario: CYP2C19 ultrarapid + esomeprazole — CPIC PPI guideline gives no recommendation for esomeprazole
    meds: [{drug: esomeprazole, dose_mg: 40}]
    pgx: {CYP2C19: ultrarapid metabolizer}
    expected: {findings: []}
  - id: E20
    scenario: CYP2C19 rapid + pantoprazole
    meds: [{drug: pantoprazole, dose_mg: 40}]
    pgx: {CYP2C19: rapid metabolizer}
    expected: {findings: [pgx-cyp2c19-pantoprazole]}
  - id: E21
    scenario: CYP2C19 normal + omeprazole (no alert)
    meds: [{drug: omeprazole, dose_mg: 20}]
    pgx: {CYP2C19: normal metabolizer}
    expected: {findings: []}

  # ---------------- Statin response, target, adherence (2 visits; statin started at visit 2)
  - id: E22
    scenario: Simvastatin 40 (moderate), LDL-C −41%, PDC 92 — responding as expected
    meds: [{drug: simvastatin, dose_mg: 40, pdc_pct: 92, start_visit: 1}]
    visits: [{ldl_c: 4.4, total_c: 6.4}, {ldl_c: 2.6, total_c: 4.6}]
    expected: {findings: [resp-simvastatin]}
  - id: E23
    scenario: Atorvastatin 40 (high), LDL-C −20%, PDC 95 — true non-response
    meds: [{drug: atorvastatin, dose_mg: 40, pdc_pct: 95, start_visit: 1}]
    visits: [{ldl_c: 4.0, total_c: 6.0}, {ldl_c: 3.2, total_c: 5.2}]
    expected: {findings: [resp-atorvastatin]}
  - id: E24
    scenario: Atorvastatin 40, LDL-C −10%, PDC 50 — adherence first, not "drug failure"
    meds: [{drug: atorvastatin, dose_mg: 40, pdc_pct: 50, start_visit: 1}]
    visits: [{ldl_c: 4.0, total_c: 6.0}, {ldl_c: 3.6, total_c: 5.6}]
    expected: {findings: [adh-atorvastatin]}
  - id: E25
    scenario: Rosuvastatin 20 (high), LDL-C −45% (expected ≥50%), PDC 90 — below expected
    meds: [{drug: rosuvastatin, dose_mg: 20, pdc_pct: 90, start_visit: 1}]
    visits: [{ldl_c: 4.0, total_c: 6.0}, {ldl_c: 2.2, total_c: 4.2}]
    expected: {findings: [resp-rosuvastatin]}
  - id: E26
    scenario: Metformin PDC 60% — adherence
    profile: {diabetes: true}
    meds: [{drug: metformin, dose_mg: 1000, pdc_pct: 60}]
    visits: [{glucose: 8.0}]
    expected: {findings: [adh-metformin]}
  - id: E27
    scenario: Amlodipine PDC exactly 80% — at threshold, no alert
    meds: [{drug: amlodipine, dose_mg: 5, pdc_pct: 80}]
    expected: {findings: []}
  - id: E28
    scenario: 60M smoker DM SBP150 on atorvastatin, LDL-C 3.2 — Thai CV risk >10%, LDL above RCPT target
    profile: {age: 60, sex: male, sbp: 150, smoker: true, diabetes: true}
    meds: [{drug: atorvastatin, dose_mg: 20, pdc_pct: 90}]
    visits: [{ldl_c: 3.2, total_c: 5.0}]
    expected: {findings: [target-atorvastatin], risks: {cvd: very_high}}
  - id: E29
    scenario: 45F low risk on atorvastatin 10, LDL-C 3.0 — risk <10%, no target alert
    meds: [{drug: atorvastatin, dose_mg: 10, pdc_pct: 90}]
    visits: [{ldl_c: 3.0, total_c: 5.0}]
    expected: {findings: [], risks: {cvd: low}}

  # ---------------- Validated risk scores
  - id: E30
    scenario: Thai CV risk worked example — 60M smoker SBP140 TC 220 mg/dL → 24.7% high
    profile: {age: 60, sex: male, sbp: 140, smoker: true}
    visits: [{total_c: 5.689}]
    expected: {risks: {cvd: high}}
  - id: E31
    scenario: Thai CV risk worked example — 45F SBP120 TC 200 mg/dL → 2.3% low
    profile: {age: 45, sex: female, sbp: 120}
    visits: [{total_c: 5.172}]
    expected: {risks: {cvd: low}}
  - id: E32
    scenario: Thai diabetes score — 52F BMI 27.9 waist 88 family history → 13/17 very high
    profile: {age: 52, weight_kg: 67, height_cm: 155, waist_cm: 88, family_history_dm: true}
    expected: {risks: {dm: very_high}, advice: [weight]}
  - id: E33
    scenario: Already diabetic — diabetes screening score not applicable
    profile: {diabetes: true}
    expected: {risks: {dm: not_assessable}}

  # ---------------- NMR add-on factors
  - id: E34
    scenario: LDL-C 2.4 at target, ApoB 105 mg/dL — ApoB discordance
    visits: [{ldl_c: 2.4, apob: 1.05}]
    expected: {factors: [apob_discordance]}
  - id: E35
    scenario: LDL-C 2.4, ApoB 85 mg/dL, low risk — no discordance
    visits: [{ldl_c: 2.4, apob: 0.85}]
    expected: {factors: []}
  - id: E36
    scenario: Diabetic, LDL-C 1.7, ApoB 85 mg/dL — above high-risk ApoB target 80
    profile: {diabetes: true}
    visits: [{ldl_c: 1.7, apob: 0.85, glucose: 7.5}]
    expected: {factors: [apob_discordance]}
  - id: E37
    scenario: GlycA 1.10 mmol/L (> P90)
    visits: [{glyca: 1.10}]
    expected: {factors: [glyca_high]}
  - id: E38
    scenario: BCAA 520 µmol/L, not diabetic
    visits: [{bcaa: 520}]
    expected: {factors: [bcaa_high]}
  - id: E39
    scenario: BCAA 520 µmol/L in known diabetic — diabetes-risk flag must not fire
    profile: {diabetes: true}
    visits: [{bcaa: 520, glucose: 7.5}]
    expected: {factors: []}

  # ---------------- Visit-to-visit change (RCV)
  - id: E40
    scenario: "Trend: ApoB −25% (improved), TG −40% (within RCV 56%), LDL-P −30% (no CVi)"
    visits: [{apob: 1.20, tg: 2.5, ldl_p: 1500}, {apob: 0.90, tg: 1.5, ldl_p: 1050}]
    expected: {trend: {apob: improved, tg: within_variation, ldl_p: not_assessable}}
  - id: E41
    scenario: "Trend: TG +70% (worsened), glucose +20% (worsened), HDL-C +25% (improved)"
    visits: [{tg: 1.2, glucose: 5.0, hdl_c: 1.2}, {tg: 2.04, glucose: 6.0, hdl_c: 1.5}]
    expected: {trend: {tg: worsened, glucose: worsened, hdl_c: improved}}
  - id: E42
    scenario: "Trend: ApoB −10% — within variation, must not claim improvement"
    visits: [{apob: 1.00}, {apob: 0.90}]
    expected: {trend: {apob: within_variation}}

  # ---------------- Negative controls / noise
  - id: E43
    scenario: Healthy 40F, no drugs, normal panel, active — nothing to flag
    profile: {age: 40}
    expected: {findings: [], factors: [], risks: {cvd: low, dm: low}}
  - id: E44
    scenario: Polypharmacy (8 drugs), full PGx panel all normal — zero alerts
    profile: {age: 66, sex: male, sbp: 128, hypertension: true}
    meds:
      - {drug: simvastatin, dose_mg: 20, pdc_pct: 90}
      - {drug: clopidogrel, dose_mg: 75, pdc_pct: 95}
      - {drug: pantoprazole, dose_mg: 40, pdc_pct: 90}
      - {drug: amlodipine, dose_mg: 5, pdc_pct: 92}
      - {drug: losartan, dose_mg: 50, pdc_pct: 92}
      - {drug: metformin, dose_mg: 1000, pdc_pct: 88}
      - {drug: allopurinol, dose_mg: 100, pdc_pct: 85}
      - {drug: aspirin, dose_mg: 81, pdc_pct: 95}
    pgx: {"HLA-B*15:02": negative, "HLA-B*58:01": negative, CYP2C19: normal metabolizer, SLCO1B1: normal function}
    # label fix 2026-09-28: default LDL-C 2.6 mmol/L = 100.5 mg/dL is above the RCPT target for this
    # patient (Thai CV risk ~20%), so the engine's target alert was correct; LDL-C set to 2.2 to keep
    # this a pure "no alerts" noise control.
    visits: [{ldl_c: 2.2}]
    expected: {findings: []}
