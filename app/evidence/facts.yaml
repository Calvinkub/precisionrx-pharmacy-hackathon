# Evidence store (versioned snapshot). Every output of the engines points to a fact id here.
# level: guideline | label | validated_score | emerging | assumption
# verified: false = wording not yet checked against the primary source (shown on screen)
snapshot: "2026-09-28b"
facts:
  TCVRS-2021:
    text: "Thai CV Risk Score 2.5 (Rama-EGAT): 10-year CVD risk; <10% low, 10–<20% moderate, 20–30% high, >30% very high"
    source: "Ramathibodi Thai CV risk calculator (formular.js, 2021)"
    url: "https://www.rama.mahidol.ac.th/cardio_vascular_risk/thai_cv_risk_score/tcvrs_en.html"
    level: validated_score
    verified: true
  TDRS-2006:
    text: "Thai diabetes risk score (0–17). ≥6 = high risk, add blood glucose test (sens 77%, spec 60%, AUC 0.74)"
    source: "Aekplakorn W et al. Diabetes Care 2006;29:1872"
    url: "https://pubmed.ncbi.nlm.nih.gov/16873795/"
    level: validated_score
    verified: true
  ADA-2026-DX:
    text: "Prediabetes: FPG 5.6–6.9 mmol/L (100–125 mg/dL); diabetes: FPG ≥7.0 mmol/L (≥126 mg/dL)"
    source: "ADA Standards of Care 2026, Section 2"
    url: "https://diabetesjournals.org/care/article/49/Supplement_1/S27/163926/2-Diagnosis-and-Classification-of-Diabetes"
    level: guideline
    verified: true
  ADA-2026-PREV:
    text: "Prediabetes: weight reduction of at least 5–7% and ≥150 min/week moderate-intensity physical activity"
    source: "ADA Standards of Care 2026, Section 3 (rec. 3.3)"
    url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC12690170/"
    level: guideline
    verified: true
  RCPT-2024-STATIN:
    text: "Statin intensity: high (>50% LDL-C lowering) atorvastatin 40–80, rosuvastatin 20; moderate (~30–50%) atorvastatin 10–20, rosuvastatin 5–10, simvastatin 20–40, pitavastatin 1–4, pravastatin 40, fluvastatin 80; low (<30%) simvastatin 10, pravastatin 10–20, fluvastatin 20–40"
    source: "RCPT Clinical Practice Guideline on dyslipidemia 2024, Table A1.1"
    url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC11650434/"
    level: guideline
    verified: true
  RCPT-2024-FOLLOWUP:
    text: "Follow-up lipid test within 4–12 weeks after starting a statin to evaluate effectiveness and assess adherence"
    source: "RCPT dyslipidemia guideline 2024"
    url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC11650434/"
    level: guideline
    verified: true
  RCPT-2024-DIET:
    text: "High LDL-C: saturated fat <7% of daily energy, replace with unsaturated oils, avoid trans fat, more fibre"
    source: "RCPT dyslipidemia guideline 2024"
    url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC11650434/"
    level: guideline
    verified: true
  RCPT-2024-TG:
    text: "High TG: abstain from alcohol, reduce carbohydrate, sugar <10% of energy"
    source: "RCPT dyslipidemia guideline 2024"
    url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC11650434/"
    level: guideline
    verified: true
  RCPT-2024-SMOKING:
    text: "Quit smoking or refer to a smoking cessation clinic"
    source: "RCPT dyslipidemia guideline 2024; Thai Hypertension guideline 2024"
    url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC11650434/"
    level: guideline
    verified: true
  THAI-HT-2024-NA:
    text: "Sodium no more than 2 g/day (≈1 tsp salt or 3 tsp fish sauce/soy sauce)"
    source: "Thai Hypertension Society guideline 2024"
    url: "https://www.ncbi.nlm.nih.gov/pmc/articles/PMC12919385/"
    level: guideline
    verified: true
  THAI-HT-2024-ALC:
    text: "Alcohol: women ≤1, men ≤2 standard drinks/day with alcohol-free days; non-drinkers should not start"
    source: "Thai Hypertension Society guideline 2024"
    url: "https://www.ncbi.nlm.nih.gov/pmc/articles/PMC12919385/"
    level: guideline
    verified: true
  WHO-PA-2020:
    text: "Adults: 150–300 min/week moderate or 75–150 min/week vigorous aerobic activity + muscle strengthening ≥2 days/week"
    source: "WHO guidelines on physical activity and sedentary behaviour 2020"
    url: "https://pubmed.ncbi.nlm.nih.gov/33239350/"
    level: guideline
    verified: true
  THAI-OBESITY:
    text: "Thai normal BMI 18.5–22.9; obesity BMI ≥25 and/or waist ≥90 cm (men) / ≥80 cm (women) or waist > height/2"
    source: "Thai Hypertension guideline 2024; Diabetes Association of Thailand"
    url: "https://www.ncbi.nlm.nih.gov/pmc/articles/PMC12919385/"
    level: guideline
    verified: true
  PQA-PDC80:
    text: "Adherence = proportion of days covered (PDC) ≥80% for statins, RAS antagonists and diabetes drugs"
    source: "Pharmacy Quality Alliance adherence measures"
    url: "https://www.pqaalliance.org/adherence-measures"
    level: guideline
    verified: true
  CPIC-SLCO1B1-2022:
    text: "SLCO1B1 decreased/poor function + simvastatin: prescribe an alternative statin; if simvastatin is warranted, limit dose to <20 mg/day"
    source: "CPIC guideline for SLCO1B1, ABCG2, CYP2C9 and statins (2022)"
    url: "https://cpicpgx.org/guidelines/cpic-guideline-for-statins/"
    level: guideline
    verified: true
  CPIC-CYP2C19-CLOP-2022:
    text: "CYP2C19 poor metabolizer, ACS and/or PCI: Avoid clopidogrel if possible. Use prasugrel or ticagrelor at standard dose if no contraindication (Strong; Moderate for non-ACS/non-PCI CV indications). Stroke/TIA: avoid clopidogrel, consider an alternative P2Y12 inhibitor (Moderate)"
    source: "CPIC guideline for CYP2C19 and clopidogrel (Lee CR et al., Clin Pharmacol Ther 2022), Tables 2–3"
    url: "https://files.cpicpgx.org/data/guideline/publication/clopidogrel/2022/35034351.pdf"
    level: guideline
    verified: true
  CPIC-CYP2C19-PPI-2020:
    text: "CYP2C19 ultrarapid metabolizer (omeprazole, lansoprazole, pantoprazole, dexlansoprazole): Increase starting daily dose by 100%. Daily dose may be given in divided doses. Monitor for efficacy (Optional). Rapid metabolizer: same as normal — initiate standard starting daily dose. No recommendation for esomeprazole or rabeprazole (level C)"
    source: "CPIC guideline for CYP2C19 and PPIs (Lima JJ et al., Clin Pharmacol Ther 2021;109:1417), Table 2"
    url: "https://files.cpicpgx.org/data/guideline/publication/PPI/2020/32770672.pdf"
    level: guideline
    verified: true
  CPIC-CYP2C19-PPI-PM-2020:
    text: "CYP2C19 intermediate/poor metabolizer: Initiate standard starting daily dose. For chronic therapy (> 12 weeks) and efficacy achieved, consider 50% reduction in daily dose and monitor for continued efficacy (IM Optional; PM Moderate for first-generation PPIs)"
    source: "CPIC guideline for CYP2C19 and PPIs (Lima JJ et al., Clin Pharmacol Ther 2021;109:1417), Table 2"
    url: "https://files.cpicpgx.org/data/guideline/publication/PPI/2020/32770672.pdf"
    level: guideline
    verified: true
  CPIC-HLAB1502:
    text: "HLA-B*15:02 positive: if patient is carbamazepine-naïve, do not use carbamazepine; if oxcarbazepine-naïve, do not use oxcarbazepine (Strong)"
    source: "CPIC guideline for HLA genotype and carbamazepine/oxcarbazepine (Phillips EJ et al., 2017), Tables 2–3"
    url: "https://files.cpicpgx.org/data/guideline/publication/carbamazepine/2017/CPIC_HLA_CBZ_OXC.pdf"
    level: guideline
    verified: true
  CPIC-HLAB5801:
    text: "HLA-B*58:01 carrier: allopurinol is contraindicated (Strong)"
    source: "CPIC guideline for HLA-B and allopurinol (Hershfield MS et al. 2013; confirmed current in 2015 update)"
    url: "https://files.cpicpgx.org/data/guideline/publication/allopurinol/2013/23232549.pdf"
    level: guideline
    verified: true
  CPIC-CYP2C19-CLOP-IM-2022:
    text: "CYP2C19 intermediate metabolizer, ACS and/or PCI: Avoid standard dose (75 mg) clopidogrel if possible. Use prasugrel or ticagrelor at standard dose if no contraindication (Strong). Non-ACS/non-PCI CV indications: no recommendation. Stroke/TIA: consider an alternative P2Y12 inhibitor (Moderate); prasugrel contraindicated after stroke/TIA"
    source: "CPIC guideline for CYP2C19 and clopidogrel (Lee CR et al., Clin Pharmacol Ther 2022), Tables 2–3"
    url: "https://files.cpicpgx.org/data/guideline/publication/clopidogrel/2022/35034351.pdf"
    level: guideline
    verified: true
  LABEL-CBZ-HLA:
    text: "Patients with ancestry in genetically at-risk populations should be screened for the presence of HLA-B*1502 prior to initiating treatment with Tegretol. Patients testing positive for the allele should not be treated with Tegretol unless the benefit clearly outweighs the risk (boxed warning)"
    source: "Tegretol (carbamazepine) US prescribing information, boxed warning"
    url: "https://www.accessdata.fda.gov/drugsatfda_docs/label/2026/020234s57lbl.pdf"
    level: label
    verified: true
  ACR-2020-HLAB5801:
    text: "We conditionally recommend testing HLA–B*5801 prior to starting allopurinol for patients of Southeast Asian descent (e.g., Han Chinese, Korean, Thai) and African American patients, who have a higher prevalence of HLA–B*5801 (conditional; very low certainty)"
    source: "2020 ACR Guideline for the Management of Gout (FitzGerald JD et al., Arthritis Care Res 2020;72:744), Table 4"
    url: "https://acrjournals.onlinelibrary.wiley.com/doi/10.1002/acr.24180"
    level: guideline
    verified: true
  LABEL-CLOP-PPI:
    text: "Clopidogrel: avoid concomitant use with omeprazole or esomeprazole"
    source: "Plavix (clopidogrel) US prescribing information"
    url: "https://www.accessdata.fda.gov/drugsatfda_docs/label/2021/020839s074lbl.pdf"
    level: label
    verified: true
  RCV-METHOD:
    text: "Reference change value RCV = √2 × 1.96 × √(CVa² + CVi²); a change larger than RCV is unlikely to be normal variation"
    source: "Fraser CG. Biological Variation: From Principles to Practice; EFLM Biological Variation Database"
    url: "https://biologicalvariation.eu/"
    level: guideline
    verified: true
  UKB-NMR-REF:
    text: "NMR reference bands = UK Biobank population P10–P90 (≈488k adults 40–69, non-fasting, includes medicated people). Not a Thai or clinical reference interval"
    source: "UK Biobank Showcase (Nightingale NMR fields 23400–23580)"
    url: "https://biobank.ndph.ox.ac.uk/showcase/label.cgi?id=220"
    level: assumption
    verified: true
  NIGHTINGALE-CVA:
    text: "Analytical CV (CVa) of NMR biomarkers from blind duplicate samples across the UK Biobank run"
    source: "Nightingale Health — Core metabolomics blood CVs"
    url: "https://nightingalehealth.com/uploads/documents/Nightingale-Health-CoreMetabolomics-Blood-CVs-PubChemIDs.pdf"
    level: guideline
    verified: true
  EFLM-CVI:
    text: "Within-subject biological variation (CVi): ApoB 6.2%, ApoA1 4.7%, LDL-C 7.4%, HDL-C 5.7%, TC 5.3%, TG 19.8%, glucose 4.7%, creatinine 4.4%, albumin 2.5%. GlycA 4.3% (Otvos 2015). No CVi found for LDL-P, BCAA, particle subclasses"
    source: "EFLM Biological Variation Database (meta-analysis medians); Otvos 2015"
    url: "https://biologicalvariation.eu/"
    level: guideline
    verified: true
  ESC-2019-APOB:
    text: "ApoB is a secondary target: <65 mg/dL very high risk, <80 mg/dL high risk, <100 mg/dL moderate risk (unchanged in 2025 focused update)"
    source: "2019 ESC/EAS dyslipidaemia guidelines; 2025 focused update"
    url: "https://academic.oup.com/eurheartj/article/46/42/4359/8234482"
    level: guideline
    verified: true
  RCPT-2024-LDL-TARGET:
    text: "Primary prevention with Thai CV Risk Score >10%: LDL-C <100 mg/dL (2.6 mmol/L) and ≥30% reduction"
    source: "RCPT dyslipidemia guideline 2024"
    url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC11650434/"
    level: guideline
    verified: true
  OTVOS-2011-DISCORDANCE:
    text: "MESA (n=6,814): when LDL-C and LDL-P are discordant, only LDL-P predicted CVD (HR 1.45 per SD vs 1.07)"
    source: "Otvos JD et al. J Clin Lipidol 2011"
    url: "https://pubmed.ncbi.nlm.nih.gov/21392724/"
    level: emerging
    verified: true
  GLYCA-CVD:
    text: "GlycA top vs bottom quartile: CVD HR 1.64, attenuated to 1.03 after adjusting for hsCRP; reflects chronic inflammation and predicts severe infection"
    source: "Akinkuolie 2014 JAHA; Ritchie 2015 Cell Syst"
    url: "https://pubmed.ncbi.nlm.nih.gov/25249300/"
    level: emerging
    verified: true
  BCAA-T2D:
    text: "Branched-chain amino acids (NMR) predicted type 2 diabetes, OR 1.31–1.33 per SD after adjusting for BMI and fasting glucose (young Finns, n=11,896)"
    source: "Ahola-Olli 2019 Diabetologia"
    url: "https://pubmed.ncbi.nlm.nih.gov/31584131/"
    level: emerging
    verified: true
  OMEGA3-CVD:
    text: "Higher DHA associated with lower CVD risk (HR 0.90 per SD) after adjusting for routine lipids"
    source: "Würtz 2015 Circulation"
    url: "https://pubmed.ncbi.nlm.nih.gov/25573147/"
    level: emerging
    verified: true
  WURTZ-2016-STATIN:
    text: "Statins lower remnant-C ~80% as much as LDL-C and TG ~25%; no robust change in amino acids, ketones or glycolysis metabolites"
    source: "Würtz 2016 JACC"
    url: "https://pubmed.ncbi.nlm.nih.gov/26965542/"
    level: emerging
    verified: true
