<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>คิวเภสัชกร — PrecisionRx</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/styles.css">
  <link rel="stylesheet" href="/static/his.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">Rx</span>
      <div><h1>คิวเภสัชกร</h1><p>คำเตือนที่แพทย์ตอบแล้ว (override / ทำตามคำแนะนำ) จาก CDS Hooks feedback · อัปเดตอัตโนมัติ</p></div>
    </div>
    <div class="topbar-right"><a class="link" href="/his">Mock HIS</a><span class="badge-synth">SYNTHETIC DATA</span></div>
  </header>
  <main class="queue-wrap" id="queue"></main>
  <script>
    "use strict";
    const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
    const SEV = { critical: "stop", warning: "action", info: "monitor" };
    const ST = { open: "รอทบทวน", reviewed: "ทบทวนแล้ว", "contacted-prescriber": "ติดต่อแพทย์แล้ว" };
    let last = "";
    async function load() {
      const q = await (await fetch("/api/queue")).json();
      const sig = JSON.stringify(q);
      if (sig === last) return;
      last = sig;
      const box = document.getElementById("queue");
      if (!q.length) { box.innerHTML = `<div class="card empty">ยังไม่มีรายการ — ลองสั่งยาใน <a class="link" href="/his">Mock HIS</a> แล้ว override คำเตือน</div>`; return; }
      box.innerHTML = q.map((x, i) => `
        <div class="card item sev-${SEV[x.indicator] || "info"} q-item">
          <div>
            <div class="title">${esc(x.summary)}</div>
            <div class="why">${x.outcome === "overridden"
              ? `แพทย์ <b>override</b>: ${esc(x.reason)}${x.comment ? ` — “${esc(x.comment)}”` : ""}`
              : "แพทย์<b>ทำตามคำแนะนำ</b>"}</div>
            <div class="meta">HN ${esc(x.patient_id)} · ${esc(x.time)} · ${esc(x.finding_id)} · ${x.fact_ids.map(esc).join(", ")}</div>
          </div>
          <div style="display:grid;gap:6px;justify-items:end">
            <span class="q-status ${x.status === "open" ? "open" : ""}">${ST[x.status]}</span>
            <div class="actions">
              <button onclick="setStatus(${i}, 'reviewed')">ทบทวนแล้ว</button>
              <button onclick="setStatus(${i}, 'contacted-prescriber')">ติดต่อแพทย์</button>
            </div>
          </div>
        </div>`).join("");
    }
    async function setStatus(i, s) { await fetch(`/api/queue/${i}/${s}`, { method: "POST" }); load(); }
    load(); setInterval(load, 2000);
  </script>
</body>
</html>
